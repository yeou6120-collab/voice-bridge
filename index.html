<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語音擺位橋接頁</title>
<style>
  /* 深色主題：色票對齊主專案 Stylesheet.html（--brand-blue/--bg/#7ec8f7），
     但本頁部署在 GAS 之外（GitHub Pages），刻意不引入該檔、自帶一份。 */
  :root {
    --brand-blue: #2980b9;
    --brand-blue-dark: #1a5276;
    --bg: #1a2535;
    --bg2: #1e2d42;
    --bg3: #243044;
    --card-bg: rgba(255,255,255,0.06);
    --text: rgba(255,255,255,0.90);
    --text-muted: rgba(255,255,255,0.45);
    --bright: #7ec8f7;
    --ok: #2ecc71;
    --warn: #e8c24a;
    --err: #e74c3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 18px; color: var(--bright); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 14px; color: var(--bright);
    margin-bottom: 8px; font-weight: bold;
  }
  /* ── 設備自檢 ─────────────────────────────── */
  .chk-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px; }
  .chk-mark { width: 20px; text-align: center; flex: none; font-weight: bold; }
  .chk-mark.ok   { color: var(--ok); }
  .chk-mark.warn { color: var(--warn); }
  .chk-mark.fail { color: var(--err); }
  .chk-mark.pend { color: var(--text-muted); }
  .chk-label { flex: none; width: 92px; color: var(--text-muted); }
  .chk-detail { flex: 1; word-break: break-all; }
  /* ── 按鈕 ─────────────────────────────────── */
  button {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--brand-blue-dark); }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  /* ── push-to-talk ────────────────────────── */
  #pttBtn {
    display: block;
    width: 100%;
    padding: 22px 0;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    background: var(--brand-blue);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    touch-action: none;          /* 防止長按觸發捲動/右鍵選單 */
  }
  #pttBtn.listening {
    background: var(--err);
    box-shadow: 0 0 0 4px rgba(231,76,60,0.35);
  }
  #pttBtn:disabled { background: var(--bg3); color: var(--text-muted); box-shadow: none; }
  #engineBadge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg3);
    color: var(--text-muted);
    margin-left: 6px;
    vertical-align: middle;
  }
  #engineBadge.ondevice { color: var(--ok); border: 1px solid var(--ok); }
  #engineBadge.cloud    { color: var(--warn); border: 1px solid var(--warn); }
  #engineBadge.none     { color: var(--err); border: 1px solid var(--err); }
  /* ── 字幕 ─────────────────────────────────── */
  #finalLines {
    min-height: 72px; max-height: 180px; overflow-y: auto;
    font-size: 15px; line-height: 1.6;
  }
  #finalLines .line { border-bottom: 1px dashed rgba(255,255,255,0.10); padding: 2px 0; }
  #finalLines .line .t { color: var(--text-muted); font-size: 11px; margin-right: 6px; }
  /* 口令輸入框＝辨識字幕＋打字輸入合一：按住說話時唯讀（辨識驅動），平時可打字 Enter 送出；
     送出後保留原句供「誤辨改字重送」。body 的 user-select:none 會擋輸入框選字，這裡要解回來。 */
  #cmdInput {
    width: 100%; min-height: 36px;
    background: var(--bg2); color: var(--bright);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    padding: 7px 10px; font-size: 15px; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  #cmdInput:read-only { font-style: italic; border-color: var(--err); }
  #cmdInput::placeholder { color: var(--text-muted); font-style: normal; font-size: 13px; }
  /* ── 命中回饋 ─────────────────────────────── */
  #fbLines { min-height: 40px; max-height: 150px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  #fbLines .fb { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.10); }
  #fbLines .fb .mk { font-weight: bold; margin-right: 6px; }
  #fbLines .fb.ok .mk { color: var(--ok); }
  #fbLines .fb.no .mk { color: var(--err); }
  #fbLines .fb .dt { color: var(--text-muted); font-size: 11px; display: block; padding-left: 20px; }
  #fbLines .fb-none { color: var(--text-muted); font-size: 12px; }
  #statusLine { font-size: 12px; color: var(--text-muted); margin-top: 6px; min-height: 16px; }
  #statusLine.err { color: var(--err); }
  #sendStat { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
  <h1>語音擺位橋接頁 <span id="engineBadge">偵測中…</span></h1>
  <div class="sub">本頁為 top-level 靜態頁（GAS 之外），負責收音、把逐字稿回送考試頁，並顯示假人動作回饋。</div>

  <!-- ── 設備自檢 ─────────────────────────── -->
  <div class="card">
    <h2>考前設備自檢</h2>
    <div id="checks"></div>
    <div class="btn-row">
      <button id="btnRecheck">重新檢查</button>
      <button id="btnMicTest">麥克風自檢（getUserMedia）</button>
      <button id="btnInstall" style="display:none">下載 zh-TW 語言包</button>
      <button id="btnVosk">啟用本地離線辨識（首次下載約 41MB）</button>
    </div>
  </div>

  <!-- ── push-to-talk ─────────────────────── -->
  <div class="card">
    <h2>按住說話</h2>
    <button id="pttBtn" disabled>偵測辨識引擎中…</button>
    <div id="statusLine"></div>
  </div>

  <!-- ── 命中回饋（考試頁回送）─────────────── -->
  <div class="card">
    <h2>假人動作回饋</h2>
    <div id="fbLines"><div class="fb-none">尚未收到考試頁回饋——說一句口令試試。</div></div>
  </div>

  <!-- ── 口令輸入／即時字幕 ─────────────────── -->
  <div class="card">
    <h2>口令輸入／即時字幕</h2>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <input id="cmdInput" type="text" autocomplete="off" enterkeyhint="send"
             placeholder="辨識文字會出現在這裡；也可直接打字，按 Enter 送出（辨識錯了可改字重送）">
      <button id="btnSendCmd" style="flex:none;">送出</button>
    </div>
    <div id="finalLines"></div>
    <div id="sendStat">已回送 0 則</div>
    <div class="btn-row">
      <button id="btnPing">測試回送（假逐字稿）</button>
      <button id="btnClear">清空字幕</button>
    </div>
  </div>

<script>
'use strict';
/* ============================================================
 * 語音擺位橋接頁
 * - 收音必須在 top-level document：GAS 頁（含 ?page=xxx 彈窗）內的
 *   使用者程式碼永遠被包在 *.googleusercontent.com 巢狀 sandbox iframe，
 *   Permissions-Policy 擋死 microphone，故本頁部署於 GitHub Pages。
 * - 訊息協定雙向（帶版本欄 v，常數見下方 VOICE-PROTO 區塊）：
 *     本頁 → 考試頁 voice:transcript（逐字稿）
 *     考試頁 → 本頁 voice:feedback（假人動作命中回饋）
 * - 辨識三層：on-device Web Speech（Chrome 139+，zh-TW，processLocally）
 *   → 雲端 webkitSpeechRecognition（cmn-Hant-TW）→ 無語音（明示原因）。
 * - 口令輸入框＝辨識字幕＋打字輸入合一：按住說話時唯讀（辨識驅動）、
 *   平時可打字 Enter 送出（誤辨可改字重送；辨識引擎全滅時打字仍可用）。
 *   打字與語音走完全相同的 voice:transcript 回送鏈，考試頁無感。
 * ============================================================ */

/* ==== VOICE-PROTO-BEGIN（三端逐字複本，勿單邊改）====
   橋接頁部署在 GitHub Pages、考試頁（Index.html）與老師獨立 3D 頁（Positioning3D.html）
   部署在 GAS，是互不相干的部署面，沒有共用檔案的可能，所以協定以「三份逐字相同的
   常數區塊」共用，由 test/voice_protocol_test.js 擋漂移。
   BRIDGE_ORIGIN 是 B0 實測到的 e.origin 實值；橋接頁一搬家，三份要一起改。 */
var VOICE_PROTO = {
  V: 1,                                                    // 協定版本（不相容變更才 +1；收到不同版本明確拒收並提示）
  BRIDGE_URL: 'https://yeou6120-collab.github.io/voice-bridge/',
  BRIDGE_ORIGIN: 'https://yeou6120-collab.github.io',       // 考試頁驗 e.origin＋回送 targetOrigin 用
  MSG_TRANSCRIPT: 'voice:transcript',                       // 橋接頁 → 考試頁 { type, v, text, final, ts, alts? }（alts＝final 的其餘辨識候選，舊端忽略即可）
  MSG_FEEDBACK: 'voice:feedback',                           // 考試頁 → 橋接頁 { type, v, ok, text, detail, ts }
  MSG_HELLO: 'voice:hello',                                 // 橋接頁 → 考試頁 { type, v, ts } 心跳：考試頁重整後靠它自動重新採用彈窗（免再開一個）
  HELLO_MS: 2000                                            // 心跳間隔
};
/* ==== VOICE-PROTO-END ==== */

/* ── opener 綁定：開頁時擷取一次，之後不重抓（防中途被換掉多播） ── */
var boundOpener = window.opener || null;
// opener 的 origin 是動態的 n-xxxx-script.googleusercontent.com，無法預先寫死；
// 若 referrer 有帶 origin 就鎖定它，否則退回 '*'（接收端 B2 會再驗 origin）。
var openerOrigin = '*';
try {
  if (document.referrer) openerOrigin = new URL(document.referrer).origin;
} catch (e) { /* 保持 '*' */ }

var sentCount = 0;
// 心跳：每 HELLO_MS 送一則 voice:hello 給 opener。考試頁一旦重整/換頁，voiceWin 參照就沒了，
// 原本只能再開一個彈窗；有心跳之後考試頁收到就把 e.source 重新採用為彈窗參照，自動接回來。
// opener 是「那個分頁」的 WindowProxy，分頁內重新導覽不會換掉它，所以接得回去。
setInterval(function () {
  if (!boundOpener) return;
  try { boundOpener.postMessage({ type: VOICE_PROTO.MSG_HELLO, v: VOICE_PROTO.V, ts: Date.now() }, openerOrigin); } catch (e) {}
}, VOICE_PROTO.HELLO_MS);
function sendToOpener(text, isFinal, alts) {
  if (!boundOpener) return false;
  try {
    var msg = { type: VOICE_PROTO.MSG_TRANSCRIPT, v: VOICE_PROTO.V, text: String(text), final: !!isFinal, ts: Date.now() };
    // final 的其餘辨識候選（第 2~N 名）：接收端第一名解析沒中時逐一改試——
    // 「外展」誤辨成「外站」時第二名往往才是對的。interim 不帶（引擎只給 final 候選）。
    if (alts && alts.length) msg.alts = alts;
    boundOpener.postMessage(msg, openerOrigin);
    sentCount++;
    document.getElementById('sendStat').textContent =
      '已回送 ' + sentCount + ' 則（targetOrigin=' + openerOrigin + '）';
    return true;
  } catch (e) {
    setStatus('回送失敗：' + e.message, true);
    return false;
  }
}

/* ── 狀態列 ───────────────────────────────── */
function setStatus(msg, isErr) {
  var el = document.getElementById('statusLine');
  el.textContent = msg || '';
  el.className = isErr ? 'err' : '';
}

/* ── 命中回饋（考試頁 → 本頁）───────────────────────────────
 * 考試頁把逐字稿丟給 3D 解析後，把「有沒有命中、假人做了什麼」回送本頁顯示——
 * 使用者按住說話時眼睛在彈窗上（手持麥克風道具），回饋放這裡才看得到。
 * 驗證以 e.source === boundOpener 為主：考試頁所在的 GAS 沙箱 origin 是動態的
 * n-xxxx-script.googleusercontent.com，寫不死也猜不得，但「就是我開頁時綁的那個視窗」
 * 這件事是確定的，比對 origin 字串更嚴格。 */
var fbCount = 0;
function onFeedback(d) {
  var host = document.getElementById('fbLines');
  if (!fbCount) host.innerHTML = '';
  fbCount++;
  var div = document.createElement('div');
  div.className = 'fb ' + (d.ok ? 'ok' : 'no');
  var mk = document.createElement('span');
  mk.className = 'mk';
  mk.textContent = d.ok ? '✓' : '✗';
  div.appendChild(mk);
  div.appendChild(document.createTextNode(String(d.text || '')));
  if (d.detail) {
    var dt = document.createElement('span');
    dt.className = 'dt';
    dt.textContent = String(d.detail);
    div.appendChild(dt);
  }
  host.appendChild(div);
  host.scrollTop = host.scrollHeight;
}
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.type !== VOICE_PROTO.MSG_FEEDBACK) return;
  if (!boundOpener || e.source !== boundOpener) return;
  if (d.v !== VOICE_PROTO.V) {
    setStatus('考試頁協定版本不符（收到 v' + d.v + '，本頁 v' + VOICE_PROTO.V + '）：請兩邊都重新整理。', true);
    return;
  }
  onFeedback(d);
});

/* ── 設備自檢 ─────────────────────────────── */
var CHECK_DEFS = [
  { id: 'chrome', label: 'Chrome 版本' },
  { id: 'opener', label: '考試頁連線' },
  { id: 'mic',    label: '麥克風權限' },
  { id: 'pack',   label: 'zh-TW 語言包' },
  { id: 'vosk',   label: '本地離線辨識' }
];
var MARKS = { ok: '✓', warn: '△', fail: '✗', pend: '…' };
function renderCheckRows() {
  var host = document.getElementById('checks');
  host.innerHTML = '';
  CHECK_DEFS.forEach(function (d) {
    var row = document.createElement('div');
    row.className = 'chk-row';
    row.innerHTML =
      '<span class="chk-mark pend" id="mark-' + d.id + '">…</span>' +
      '<span class="chk-label">' + d.label + '</span>' +
      '<span class="chk-detail" id="detail-' + d.id + '">檢查中…</span>';
    host.appendChild(row);
  });
}
function setCheck(id, state, detail) {
  var m = document.getElementById('mark-' + id);
  m.textContent = MARKS[state];
  m.className = 'chk-mark ' + state;
  document.getElementById('detail-' + id).textContent = detail;
}

/* Chrome 版本（userAgent 解析；139+ 才有 on-device Web Speech zh-TW） */
function checkChrome() {
  var m = navigator.userAgent.match(/Chrom(?:e|ium)\/(\d+)/);
  var isEdge = /Edg\//.test(navigator.userAgent);
  if (!m) { setCheck('chrome', 'fail', '非 Chrome/Chromium 瀏覽器，語音功能不支援'); return null; }
  var ver = parseInt(m[1], 10);
  if (isEdge) { setCheck('chrome', 'warn', 'Edge ' + ver + '：語音走 Azure 且受 GPO 開關管制，不在支援矩陣'); return ver; }
  if (ver >= 139) setCheck('chrome', 'ok', 'Chrome ' + ver + '（≥139，支援 on-device 辨識）');
  else setCheck('chrome', 'warn', 'Chrome ' + ver + '（<139，無 on-device，只能雲端辨識）');
  return ver;
}

/* 考試頁連線（window.opener 是否存在；COOP 若被切斷會是 null） */
function checkOpener() {
  if (boundOpener) {
    setCheck('opener', 'ok', 'window.opener 存在' +
      (openerOrigin !== '*' ? '（referrer origin：' + openerOrigin + '）' : '（referrer 無 origin，回送用 targetOrigin=*）'));
  } else {
    setCheck('opener', 'fail',
      'window.opener 為 null——請從考試頁用按鈕開啟本頁，勿直接輸入網址（若確定是從考試頁開的，可能是 COOP 被切斷，回報開發者）');
  }
}

/* 麥克風權限（permissions.query；能監聽 onchange 即時更新） */
function checkMicPermission() {
  if (!navigator.permissions || !navigator.permissions.query) {
    setCheck('mic', 'warn', '瀏覽器不支援 permissions.query，請按「麥克風自檢」實測');
    return;
  }
  navigator.permissions.query({ name: 'microphone' }).then(function (st) {
    applyMicState(st.state);
    st.onchange = function () { applyMicState(st.state); };
  }).catch(function () {
    setCheck('mic', 'warn', '無法查詢，請按「麥克風自檢」實測');
  });
}
function applyMicState(state) {
  if (state === 'granted') setCheck('mic', 'ok', '已授權');
  else if (state === 'prompt') setCheck('mic', 'warn', '尚未授權——第一次按住說話（或按「麥克風自檢」）時會跳出詢問，請按「允許」');
  else setCheck('mic', 'fail', '已封鎖——請點網址列左側鎖頭圖示 → 麥克風 → 允許，然後重新整理');
}

/* 麥克風自檢：getUserMedia 實測（B0 驗證清單第 2 條） */
function micTest() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setCheck('mic', 'fail', '此環境無 getUserMedia（需 HTTPS top-level 頁）');
    return;
  }
  setCheck('mic', 'pend', 'getUserMedia 測試中…');
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    stream.getTracks().forEach(function (t) { t.stop(); });   // 立即釋放，只驗證能拿到
    setCheck('mic', 'ok', 'getUserMedia 成功（已授權，音軌可取得）');
  }).catch(function (err) {
    setCheck('mic', 'fail', micErrHint_(err));
  });
}
/**
 * 把 getUserMedia 的錯誤翻成「該去點哪裡」。
 * 考場上看到 `NotAllowedError` 沒人知道要做什麼，而且這個名字底下其實有兩種完全不同的
 * 情況：**作業系統擋的**（訊息含 "system"，要去 Windows 設定）與**瀏覽器/使用者拒絕的**
 * （點網址列鎖頭）。兩者的解法不同，混在一起講等於沒講。
 */
function micErrHint_(err) {
  var name = (err && err.name) || 'Error';
  var msg = String((err && err.message) || '');
  var tail = '　［' + name + '：' + msg + '］';
  if (name === 'NotAllowedError' || name === 'SecurityError') {
    if (/system/i.test(msg)) {
      return '被**作業系統**擋住 → Windows 設定 → 隱私權與安全性 → 麥克風，'
           + '開啟「讓應用程式存取您的麥克風」**與**「讓桌面應用程式存取您的麥克風」'
           + '（後者常被漏掉，瀏覽器算桌面應用程式），然後重新整理本頁。' + tail;
    }
    return '被**瀏覽器或使用者**拒絕 → 點網址列左邊的鎖頭圖示 → 麥克風 → 允許，'
         + '然後重新整理本頁。（若曾按過「封鎖」，要在這裡改回來。）' + tail;
  }
  if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    return '找不到麥克風裝置 → 確認麥克風有插上、且在 Windows 音效設定裡沒有被停用。' + tail;
  }
  if (name === 'NotReadableError' || name === 'TrackStartError') {
    return '麥克風被其他程式占用 → 關掉會議軟體／錄音程式後再試。' + tail;
  }
  return 'getUserMedia 失敗：' + name + '（' + msg + '）';
}

/* ── 辨識引擎偵測：on-device → 雲端 → 無 ───────────────── */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var engineMode = 'none';   // 'ondevice' | 'cloud' | 'none'

function setEngineBadge() {
  var b = document.getElementById('engineBadge');
  if (voskState === 'ready') { b.textContent = '本地離線辨識（Vosk）'; b.className = 'ondevice'; }
  else if (engineMode === 'ondevice') { b.textContent = 'on-device 辨識'; b.className = 'ondevice'; }
  else if (engineMode === 'cloud') { b.textContent = '雲端辨識（降級）'; b.className = 'cloud'; }
  else { b.textContent = '語音不可用'; b.className = 'none'; }
  var ptt = document.getElementById('pttBtn');
  if (voskState !== 'ready' && engineMode === 'none') {
    ptt.disabled = true;
    ptt.textContent = '語音不可用（可改用下方打字輸入）';
  } else {
    ptt.disabled = false;
    ptt.textContent = '🎙 按住說話';
  }
}

function detectEngine() {
  if (!SR) {
    engineMode = 'none';
    setEngineBadge();
    setCheck('pack', 'fail', '瀏覽器無 SpeechRecognition API');
    setStatus('此瀏覽器不支援 Web Speech API，語音功能無法使用。', true);
    return;
  }
  // 先試 on-device 可用性（Chrome 139+ 才有 available 靜態方法）
  if (typeof SR.available === 'function') {
    SR.available({ langs: ['zh-TW'], processLocally: true }).then(function (status) {
      if (status === 'available') {
        engineMode = 'ondevice';
        setCheck('pack', 'ok', '已安裝（離線可辨識）');
      } else if (status === 'downloadable') {
        engineMode = 'cloud';   // 語言包下載完成前先用雲端
        setCheck('pack', 'warn', '可下載但尚未安裝（約 60MB）——請按「下載 zh-TW 語言包」；下載前暫用雲端辨識');
        document.getElementById('btnInstall').style.display = '';
      } else if (status === 'downloading') {
        engineMode = 'cloud';
        setCheck('pack', 'warn', '下載中——完成後按「重新檢查」；期間暫用雲端辨識');
      } else {  // 'unavailable'
        engineMode = 'cloud';
        setCheck('pack', 'fail', 'on-device 不支援 zh-TW（status=' + status + '），降級雲端辨識');
      }
      setEngineBadge();
    }).catch(function (e) {
      engineMode = 'cloud';
      setCheck('pack', 'warn', 'available() 查詢失敗（' + e.message + '），降級雲端辨識');
      setEngineBadge();
    });
  } else {
    engineMode = 'cloud';
    setCheck('pack', 'warn', '此版本無 on-device API（需 Chrome 139+），降級雲端辨識（斷網即失效）');
    setEngineBadge();
  }
}

/* 語言包下載（SpeechRecognition.install） */
function installPack(btn) {
  btn.disabled = true;
  btn.textContent = '下載中…（約 60MB）';
  setCheck('pack', 'pend', '語言包下載中…');
  SR.install({ langs: ['zh-TW'], processLocally: true }).then(function (ok) {
    if (ok) {
      btn.style.display = 'none';
      detectEngine();           // 重新偵測，成功會切到 on-device
    } else {
      btn.disabled = false;
      btn.textContent = '下載 zh-TW 語言包';
      setCheck('pack', 'fail', 'install() 回傳失敗——請確認網路後重試');
    }
  }).catch(function (e) {
    btn.disabled = false;
    btn.textContent = '下載 zh-TW 語言包';
    setCheck('pack', 'fail', '下載失敗：' + e.message);
  });
}

/* ── 本地離線辨識（Vosk WASM）──────────────────────────
 * 為什麼要第四個引擎：雲端 webkitSpeechRecognition 網路 lag 大、醫放術語辨識差；
 * Chrome on-device 的 zh-TW 語言包多數機器裝不了。Vosk 在本頁跑 WASM（vosk.js，
 * worker 內嵌單檔），模型 vosk-model-small-cn-0.22（41MB，首次下載後走瀏覽器快取）
 * 與本頁同源部署在 GitHub Pages。模型輸出簡體＋空格分詞 → normVosk_ 去空格＋
 * s2t.js（OpenCC 單字表）轉繁體再回送，解析端拼音容錯層吸收剩餘同音誤辨。
 * 啟用狀態記 localStorage：下次開頁自動初始化，考前不用再按一次。 */
var VOSK_MODEL_URL = 'vosk-model-small-cn-0.22.tar.gz';
var VOSK_LS_KEY = 'bridge_vosk_v1';
var VOSK_TIMEOUT_MS = 120000;     // 看門狗：createModel 多半不會 reject，卡住要自己喊
var voskState = 'off';            // 'off' | 'loading' | 'ready' | 'error'
var voskModel = null, voskRec = null, voskRecRate = 0;
var voskAudio = null;             // PTT 期間的 { stream, ctx, src, node }
var VOSK_RATE = 16000;            // 模型的取樣率：context 直接開這個，省掉 3 倍重取樣
var VOSK_PARTIAL_MS = 250;        // 暫定結果節流（每個音框都送＝3D 反覆套暫定姿勢）
var voskPartialAt_ = 0, voskReleaseAt_ = 0, voskAudioSec_ = 0;

function setVoskBtn() {
  var btn = document.getElementById('btnVosk');
  if (voskState === 'ready') btn.textContent = '停用本地離線辨識';
  else if (voskState === 'loading') { btn.textContent = '模型載入中…'; }
  else btn.textContent = '啟用本地離線辨識（首次下載約 41MB）';
  btn.disabled = (voskState === 'loading');
}
function voskToggle() {
  if (voskState === 'ready') {          // 停用：清記憶並釋放，退回原本的引擎鏈
    try { if (voskModel) voskModel.terminate(); } catch (e) {}
    voskModel = null; voskRec = null; voskState = 'off';
    try { localStorage.removeItem(VOSK_LS_KEY); } catch (e) {}
    setCheck('vosk', 'warn', '已停用——退回 on-device／雲端辨識');
    setVoskBtn(); setEngineBadge();
    return;
  }
  voskInit();
}
function voskInit() {
  if (voskState === 'loading' || voskState === 'ready') return;
  voskState = 'loading'; setVoskBtn();
  setCheck('vosk', 'pend', '載入辨識引擎（vosk.js＋s2t.js）…');
  loadScript_('s2t.js', function (errA) {
  loadScript_('vosk.js', function (errB) {
    if (errA || errB || typeof Vosk === 'undefined' || typeof s2t !== 'function') {
      voskState = 'error';
      setCheck('vosk', 'fail', 'vosk.js／s2t.js 載入失敗（部署缺檔？），退回原本引擎');
      setVoskBtn(); setEngineBadge();
      return;
    }
    // ⚠ `Vosk.createModel` 的下載與解壓都在 worker 裡，**失敗多半不會 reject**
    //   （worker 內的 emscripten abort／404 拿不到 tar 都只是不再往下走）⇒ 症狀是
    //   「一直卡在模型載入中」而不是印出錯誤。所以這裡先做兩件事再交給它：
    //     ① 512 bytes 的 Range 探針——404／Git LFS 指標／不是 gzip／檔案太小，
    //        這四種一次就分得出來，而且只花半 KB（不重複下載 41MB）
    //     ② 看門狗——超過 VOSK_TIMEOUT_MS 就把「卡住」轉成明確訊息並退回原引擎；
    //        真的只是慢的話，之後 promise 仍會 resolve，settled 旗標會把它補回 ready
    voskProbe_(voskModelUrl_(), function (perr, info) {
      if (perr) {
        voskState = 'error';
        setCheck('vosk', 'fail', perr.message + '——退回原本引擎');
        setVoskBtn(); setEngineBadge();
        return;
      }
      var t0 = Date.now(), settled = false;
      var tick = setInterval(function () {
        if (settled) return;
        var sec = Math.round((Date.now() - t0) / 1000);
        setCheck('vosk', 'pend', '模型下載／解壓中…已 ' + sec + ' 秒（' + info.sizeTxt
          + '；首次才下載，之後走瀏覽器快取）');
        if (sec * 1000 >= VOSK_TIMEOUT_MS) {
          clearInterval(tick);
          voskState = 'error'; setVoskBtn(); setEngineBadge();
          setCheck('vosk', 'fail', '模型載入超過 ' + Math.round(VOSK_TIMEOUT_MS / 1000)
            + ' 秒沒有回應（檔案本身正常：' + info.sizeTxt + '）。'
            + '常見原因：網路慢（41MB 還在下載，可再等）／worker 內解壓失敗'
            + '（跨源隔離 crossOriginIsolated=' + (self.crossOriginIsolated ? 'true' : 'false')
            + '，SharedArrayBuffer=' + (typeof SharedArrayBuffer === 'undefined' ? '不可用' : '可用')
            + '）／記憶體不足。先退回原本引擎，載完會自動切過去。');
        }
      }, 5000);
      setCheck('vosk', 'pend', '模型下載／解壓中…（' + info.sizeTxt + '）');
      Vosk.createModel(voskModelUrl_()).then(function (model) {
        settled = true; clearInterval(tick);
        voskModel = model; voskState = 'ready';
        try { localStorage.setItem(VOSK_LS_KEY, '1'); } catch (e) {}
        setCheck('vosk', 'ok', '已就緒（完全離線、不經任何伺服器）'
          + '　載入耗時 ' + Math.round((Date.now() - t0) / 1000) + ' 秒');
        setVoskBtn(); setEngineBadge();
      }).catch(function (e) {
        settled = true; clearInterval(tick);
        voskState = 'error';
        setCheck('vosk', 'fail', '模型載入失敗：' + (e && e.message || e) + '——退回原本引擎');
        setVoskBtn(); setEngineBadge();
      });
    });
  });
  });
}
/** 模型的**絕對**網址：worker 內的相對路徑基準未必是本頁（blob worker 會解錯） */
function voskModelUrl_() {
  try { return new URL(VOSK_MODEL_URL, location.href).href; } catch (e) { return VOSK_MODEL_URL; }
}
/** 512 bytes Range 探針：把「卡住」拆成四種說得出口的失敗 */
function voskProbe_(url, cb) {
  if (typeof fetch !== 'function') { cb(null, { sizeTxt: '大小未知' }); return; }   // 探不了就別擋
  fetch(url, { headers: { Range: 'bytes=0-511' } }).then(function (res) {
    if (res.status === 404) throw new Error('模型檔不存在（404）：' + url
      + '——vosk-model-small-cn-0.22.tar.gz 沒有推到橋接頁的部署面（Pages 是獨立部署，clasp 不會推它）');
    if (!res.ok && res.status !== 206) throw new Error('模型檔讀取失敗（HTTP ' + res.status + '）');
    var cr = res.headers.get('Content-Range') || '';
    var total = cr ? Number(cr.split('/')[1]) : Number(res.headers.get('Content-Length') || 0);
    return res.arrayBuffer().then(function (buf) { return { buf: buf, total: total, ct: res.headers.get('Content-Type') || '' }; });
  }).then(function (r) {
    var b = new Uint8Array(r.buf);
    var head = '';
    for (var i = 0; i < Math.min(b.length, 40); i++) head += String.fromCharCode(b[i]);
    if (head.indexOf('version https://git-lfs') === 0)
      throw new Error('模型檔是 Git LFS 指標檔，不是真的模型——GitHub Pages **不會**還原 LFS 內容，'
        + '請把 tar.gz 從 LFS 移出、以一般檔案重推（41MB 未超過 Pages 的單檔上限）');
    if (!(b[0] === 0x1f && b[1] === 0x8b))
      throw new Error('模型檔不是 gzip（Content-Type: ' + r.ct + '；前幾個位元組「'
        + head.replace(/[^\x20-\x7e]/g, '.').slice(0, 24) + '」）——多半是 404 頁面或檔案被改寫過');
    if (r.total && r.total < 1024 * 1024)
      throw new Error('模型檔只有 ' + r.total + ' bytes（應約 41MB）——上傳不完整');
    cb(null, { sizeTxt: r.total ? (r.total / 1048576).toFixed(1) + 'MB' : '大小未知' });
  }).catch(function (e) {
    // 網路層失敗（離線／被擋）也要說得出口，但不要把「探針失敗」當成模型壞掉
    if (e && e.message && /模型檔/.test(e.message)) cb(e);
    else cb(null, { sizeTxt: '大小未知（探針失敗：' + (e && e.message || e) + '）' });
  });
}
var loadedScripts_ = {};
function loadScript_(src, cb) {
  if (loadedScripts_[src]) { cb(null); return; }
  var s = document.createElement('script');
  s.src = src;
  s.onload = function () { loadedScripts_[src] = true; cb(null); };
  s.onerror = function () { cb(new Error('load fail: ' + src)); };
  document.head.appendChild(s);
}
/* 模型輸出正規化：去空格分詞＋簡→繁（s2t.js） */
function normVosk_(s) {
  var t = String(s || '').replace(/\s+/g, '');
  return t ? s2t(t) : '';
}
function voskAttachRec_(sampleRate) {
  if (voskRec && voskRecRate === sampleRate) return;
  if (voskRec) { try { voskRec.remove(); } catch (e) {} }
  voskRec = new voskModel.KaldiRecognizer(sampleRate);
  voskRecRate = sampleRate;
  voskRec.on('partialresult', function (m) {
    var txt = normVosk_(m.result && m.result.partial);
    if (!txt) return;
    document.getElementById('cmdInput').value = txt;
    // 暫定結果**節流**：每個音框都回送的話，3D 端會為同一句話反覆套用暫定姿勢
    // （每次都走補間），看起來就是「愈講愈頓」。250ms 一次已足夠給人「有在聽」的回饋。
    var now = Date.now();
    if (now - voskPartialAt_ < VOSK_PARTIAL_MS) return;
    voskPartialAt_ = now;
    sendToOpener(txt, false);
  });
  voskRec.on('result', function (m) {
    var txt = normVosk_(m.result && m.result.text);
    if (!txt) return;
    // 放開按鈕 → 拿到 final 的實際毫秒數。把「感覺很 lag」變成可比較的數字
    // （辨識時間 vs 語音長度＝即時率 RTF，>1 表示比講話還慢，那才是真的追不上）
    if (voskReleaseAt_) {
      var ms = Date.now() - voskReleaseAt_;
      var rtf = voskAudioSec_ > 0 ? (ms / 1000 / voskAudioSec_) : 0;
      setStatus('辨識完成：放開後 ' + ms + 'ms（語音 ' + voskAudioSec_.toFixed(1) + 's、'
        + voskRecRate + 'Hz、即時率 ' + rtf.toFixed(2) + '）');
      voskReleaseAt_ = 0;
    }
    appendFinalLine(txt);
    sendToOpener(txt, true);
    document.getElementById('cmdInput').value = txt;
  });
}
function voskStart_() {
  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
  }).then(function (stream) {
    if (!listening) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }   // 授權跳窗期間已放手
    // ⚠ 取樣率：模型是 **16kHz** 的，而 `new AudioContext()` 在多數機器上是 48kHz
    //   ⇒ 每一幀送進 worker 的樣本數是需要的 3 倍，Vosk 得先自己重取樣再算特徵，
    //   等於白花 3 倍的 CPU（這是「會 lag」最直接的一項）。直接開 16kHz 的 context，
    //   讓瀏覽器用原生程式碼做重取樣。舊瀏覽器不支援 sampleRate 選項就退回預設值。
    var ctx;
    try { ctx = new AudioContext({ sampleRate: VOSK_RATE }); } catch (e) { ctx = new AudioContext(); }
    if (ctx.sampleRate !== VOSK_RATE) { try { ctx.close(); } catch (e2) {} try { ctx = new AudioContext(); } catch (e3) {} }
    voskAttachRec_(ctx.sampleRate);
    var src = ctx.createMediaStreamSource(stream);
    // 緩衝：16kHz 下 2048 樣本＝128ms（48kHz 的 4096 是 85ms）。太大＝暫定結果變遲鈍、
    // 太小＝主執行緒事件過密（ScriptProcessor 跑在主執行緒上）。
    var node = ctx.createScriptProcessor(2048, 1, 1);
    voskAudioSec_ = 0;
    node.onaudioprocess = function (ev) {
      if (!listening) return;
      voskAudioSec_ += ev.inputBuffer.duration;
      try { voskRec.acceptWaveform(ev.inputBuffer); } catch (e) { /* worker 忙碌丟一幀無妨 */ }
    };
    src.connect(node);
    node.connect(ctx.destination);   // ScriptProcessor 沒接 destination 部分瀏覽器不觸發
    voskAudio = { stream: stream, ctx: ctx, src: src, node: node };
  }).catch(function (err) {
    setStatus('麥克風失敗：' + err.name + '（' + err.message + '）', true);
    stopTalk();
  });
}
function voskStop_() {
  if (!voskAudio) return;
  voskReleaseAt_ = Date.now();   // 放開按鈕的時刻——量「還要等多久才出 final」
  try { voskAudio.src.disconnect(); voskAudio.node.disconnect(); } catch (e) {}
  try { voskAudio.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
  try { voskAudio.ctx.close(); } catch (e) {}
  voskAudio = null;
  if (voskRec) { try { voskRec.retrieveFinalResult(); } catch (e) {} }   // 逼出最後 final（result 事件回送）
}

/* ── push-to-talk（按住說話）────────────────────────────
 * 手勢慣例比照 Positioning3D 手開關：pointerdown 開始、
 * pointerup / pointercancel / window blur 都算放手——
 * 少掛 blur 會在切視窗時卡在「聽取中」出不來。 */
var listening = false;
var recognizer = null;

function newRecognizer() {
  var rec = new SR();
  rec.interimResults = true;
  rec.continuous = true;          // 按住期間持續收，放開才 stop
  rec.maxAlternatives = 5;   // 醫放術語常被誤辨成同音日常詞，多要幾個候選給解析層改試
  if (engineMode === 'ondevice') {
    rec.lang = 'zh-TW';
    try { rec.processLocally = true; } catch (e) { /* 舊版屬性不存在就算了 */ }
  } else {
    rec.lang = 'cmn-Hant-TW';     // 雲端辨識的繁中台灣代碼
  }
  rec.onresult = onRecResult;
  rec.onerror = onRecError;
  rec.onend = function () {
    // 引擎自行結束（雲端逾時等）也要歸位，不然按鈕狀態卡死
    if (listening) stopTalk();
  };
  return rec;
}

function onRecResult(ev) {
  var interim = '';
  var inp = document.getElementById('cmdInput');
  for (var i = ev.resultIndex; i < ev.results.length; i++) {
    var r = ev.results[i];
    var text = r[0] ? r[0].transcript : '';
    if (!text) continue;
    if (r.isFinal) {
      var alts = [];
      for (var a = 1; a < r.length; a++) {
        var alt = r[a] && r[a].transcript ? String(r[a].transcript).trim() : '';
        if (alt && alt !== text) alts.push(alt);
      }
      appendFinalLine(text);
      sendToOpener(text, true, alts);
      inp.value = text;   // final 留在輸入框：辨識錯了放開後可直接改字 Enter 重送
    } else {
      interim += text;
    }
  }
  if (interim) { inp.value = interim; sendToOpener(interim, false); }
}

/* ── 打字送出（與辨識共用同一個輸入框、同一條回送鏈）──────
 * 按住說話期間輸入框唯讀（辨識驅動）；平時可打字，Enter 或「送出」鈕送出。
 * 送出後整句選取（再打字即覆蓋、想改字直接點），不清空。
 * 不依賴 SpeechRecognition——辨識引擎整個不可用時，打字仍是活路。 */
function sendTyped() {
  if (listening) return;
  var inp = document.getElementById('cmdInput');
  var text = inp.value.trim();
  if (!text) return;
  var ok = sendToOpener(text, true);
  if (!ok) { setStatus('送出失敗：window.opener 不存在（請從考試頁開啟本頁）。', true); return; }
  appendFinalLine(text, true);
  inp.select();
}

function onRecError(ev) {
  var msgMap = {
    'not-allowed': '麥克風被拒絕——請允許權限後重試',
    'no-speech': '沒聽到聲音（按住期間請說話）',
    'audio-capture': '找不到麥克風裝置',
    'network': '雲端辨識網路失敗（斷網時只有 on-device 可用）',
    'language-not-supported': '此引擎不支援目前語言',
    'service-not-allowed': '辨識服務被系統政策封鎖（受管電腦 GPO？）'
  };
  setStatus('辨識錯誤：' + (msgMap[ev.error] || ev.error), true);
  // on-device 路徑掛掉（語言/服務層），自動降一級改試雲端
  if (engineMode === 'ondevice' &&
      (ev.error === 'language-not-supported' || ev.error === 'service-not-allowed')) {
    engineMode = 'cloud';
    setEngineBadge();
    setStatus('on-device 失敗，已降級雲端辨識，請再試一次。', true);
  }
}

function startTalk() {
  if (listening) return;
  if (voskState !== 'ready' && engineMode === 'none') return;
  listening = true;
  document.getElementById('pttBtn').classList.add('listening');
  document.getElementById('pttBtn').textContent = '● 聽取中…（放開結束）';
  var inp = document.getElementById('cmdInput');
  inp.value = '';
  inp.readOnly = true;    // 辨識期間唯讀：interim 流會覆寫，不讓打字互搶
  setStatus('');
  if (voskState === 'ready') { voskStart_(); return; }   // 本地離線優先，不碰 Web Speech
  recognizer = newRecognizer();   // 每次按下都用全新實例，避免殘留狀態
  try {
    recognizer.start();
  } catch (e) {
    setStatus('辨識啟動失敗：' + e.message, true);
    stopTalk();
  }
}

function stopTalk() {
  if (!listening) return;
  listening = false;
  document.getElementById('pttBtn').classList.remove('listening');
  document.getElementById('pttBtn').textContent = '🎙 按住說話';
  document.getElementById('cmdInput').readOnly = false;
  voskStop_();   // 本地離線路徑的收尾（沒在用時是 no-op）
  if (recognizer) {
    try { recognizer.stop(); } catch (e) { /* 已停就算了 */ }
    // 不清 recognizer：stop 後 onresult 還會補送最後的 final 結果
  }
}

/* ── 字幕歷史區（typed=true 時加 ⌨ 標記，僅本頁顯示用，不進協定）── */
function appendFinalLine(text, typed) {
  var host = document.getElementById('finalLines');
  var div = document.createElement('div');
  div.className = 'line';
  var t = new Date();
  var hh = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
  div.innerHTML = '<span class="t">' + hh + (typed ? ' ⌨' : '') + '</span>';
  div.appendChild(document.createTextNode(text));
  host.appendChild(div);
  host.scrollTop = host.scrollHeight;
}

/* ── 事件繫結 ─────────────────────────────── */
window.addEventListener('DOMContentLoaded', function () {
  renderCheckRows();
  checkChrome();
  checkOpener();
  checkMicPermission();
  detectEngine();
  // 本地離線辨識：上次啟用過就自動載入（模型走瀏覽器快取，不用重新下載）
  setVoskBtn();
  var voskOn = false;
  try { voskOn = localStorage.getItem(VOSK_LS_KEY) === '1'; } catch (e) {}
  if (voskOn) voskInit();
  else setCheck('vosk', 'warn', '未啟用——啟用後完全離線辨識，免網路、術語同音誤辨由考試頁拼音層吸收');
  document.getElementById('btnVosk').addEventListener('click', voskToggle);

  var ptt = document.getElementById('pttBtn');
  ptt.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    startTalk();
  });
  // 放手三兄弟（比照手開關：漏掛 blur 會卡住）
  window.addEventListener('pointerup', stopTalk, true);
  window.addEventListener('pointercancel', stopTalk, true);
  window.addEventListener('blur', stopTalk);
  ptt.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  document.getElementById('btnRecheck').addEventListener('click', function () {
    checkChrome(); checkOpener(); checkMicPermission(); detectEngine();
  });
  document.getElementById('btnMicTest').addEventListener('click', micTest);
  document.getElementById('btnInstall').addEventListener('click', function () { installPack(this); });
  document.getElementById('btnPing').addEventListener('click', function () {
    var ok = sendToOpener('（測試訊息 ' + new Date().toLocaleTimeString() + '）', true);
    if (ok) { appendFinalLine('（測試訊息已回送）'); setStatus('測試訊息已 postMessage 給考試頁，請在考試頁 Console 確認收到。'); }
    else setStatus('回送失敗：window.opener 不存在（請從考試頁開啟本頁）。', true);
  });
  document.getElementById('btnSendCmd').addEventListener('click', sendTyped);
  document.getElementById('cmdInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); sendTyped(); }
  });
  document.getElementById('btnClear').addEventListener('click', function () {
    document.getElementById('finalLines').innerHTML = '';
    document.getElementById('cmdInput').value = '';
    document.getElementById('fbLines').innerHTML = '<div class="fb-none">尚未收到考試頁回饋——說一句口令試試。</div>';
    fbCount = 0;
  });
});
</script>
